services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file: production.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./:/var/www/html
      - storage:/var/www/html/storage
    networks: [logistics]

  web:
    build:
      context: ..
      dockerfile: logistics-api/docker/nginx/Dockerfile
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html:ro
      - storage:/var/www/html/storage
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    networks: [logistics]

  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan horizon
    env_file: production.env
    depends_on: [app, redis]
    volumes:
      - ./:/var/www/html
      - storage:/var/www/html/storage
    networks: [logistics]

  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    env_file: production.env
    depends_on: [app, redis]
    ports:
      - "8080:8080"
    volumes:
      - ./:/var/www/html
    networks: [logistics]

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-logistics}
      MYSQL_USER: ${DB_USERNAME:-logistics}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-root-me}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [logistics]

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks: [logistics]

networks:
  logistics:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  storage:
