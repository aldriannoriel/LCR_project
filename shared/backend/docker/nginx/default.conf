server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /api/alona/rider_register.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/api/alona/rider_register.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/api/alona;
        fastcgi_pass app:9000;
    }
    location = /api/alona/rider_review.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/api/alona/rider_review.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/api/alona;
        fastcgi_pass app:9000;
    }
    location = /api/alona/assign_rider_locations.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/api/alona/assign_rider_locations.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/api/alona;
        fastcgi_pass app:9000;
    }
    location = /api/alona/get_riders.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/api/alona/get_riders.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/api/alona;
        fastcgi_pass app:9000;
    }
    location ~ ^/api/alona/auth/(register_rider|register_staff)\.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/api/alona/auth/$1.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/api/alona/auth;
        fastcgi_pass app:9000;
    }
    location ~ ^/api/alona/admin/(review_user|assign_rider_locations|get_users)\.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/api/alona/admin/$1.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/api/alona/admin;
        fastcgi_pass app:9000;
    }
    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_pass app:9000;
    }
    location /app/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
    location ~ /\. { deny all; }
}
